<!--
  You.Ge Assistant PWA integration.
  Keep /progressier.js at its existing path when migrating an installed app.
  Load the public domain registry and resolver before pwa.js.
-->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/assistant-widget.css" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

<meta name="theme-color" content="#155eef" />
<meta name="application-name" content="You.Ge Assistant" />
<meta name="apple-mobile-web-app-title" content="You.Ge" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="msapplication-TileColor" content="#f8fafc" />
<meta name="msapplication-TileImage" content="/icons/icon-144.png" />
<meta name="msapplication-config" content="/browserconfig.xml" />

<script src="/domain-registry.js" defer></script>
<script src="/domain-config.js" defer></script>
<script src="/dns-diagnostics.js" defer></script>
<script
  src="/pwa.js"
  defer
  data-sw="/progressier.js"
  data-manifest="/manifest.webmanifest"
></script>

<!-- Optional attributes for the pwa.js script: data-base-path, data-css,
     data-icon, data-splash-icon, data-app-name, data-theme-color,
     data-start-url, data-vapid-public-key, data-push-endpoint,
     data-install-banner, data-push-banner, data-offline-alert, data-welcome,
     data-toolbox, data-toolbox-position, data-no-meta, data-no-css,
     data-no-splash, data-auto-update, data-csp-nonce, data-debug. -->

<!-- Intelligent Floating Assistant. Configuration is data-only and must be
     set before assistant-state.js. Replace projectId/branding/position with
     the values published for this project; no dashboard is contacted after
     initialization. Use assistant-widget.js for a dependency-free DOM page,
     or mount a React renderer over window.YouGeAssistant instead. -->
<script>
  window.YOU_GE_ASSISTANT_CONFIG = {
    projectId: 'your-project-id',
    position: 'bottom-right',
    offsets: { x: 20, y: 20 },
    branding: {
      name: 'Your project',
      shortName: 'Project',
      icon: '/icons/icon-192.png',
      themeColor: '#155eef'
    },
    theme: 'auto',
    modules: {
      installation: true,
      diagnostics: true,
      recovery: true,
      failover: true,
      help: true,
      updates: true
    },
    notifications: {
      dismissible: true,
      suppressRepeats: true,
      criticalPersistent: true
    },
    actions: [],
    features: []
  };
</script>
<script src="/assistant-state.js" defer></script>
<script src="/assistant-widget.js" defer></script>
