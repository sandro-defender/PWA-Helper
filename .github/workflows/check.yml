name: check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Install, type-check and build ReactBits example
        run: npm ci && npm run typecheck && npm run build
        working-directory: example

      - name: Static checks
        run: node scripts/check.mjs

      - name: Syntax check every script
        run: |
          for file in pwa.js progressier.js offline.js domain-config.js domain-registry.js dns-diagnostics.js assistant-state.js assistant-widget.js manifest-handler.js functions/manifest.webmanifest.js qrcode.js example/example.js example/vite.config.js; do
            node --check "$file"
          done

      - name: Unit tests
        run: npm test

      - name: Manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
