name: sdk-release-prep

# Release preparation gate for @youge/assistant-sdk.
#
# - Runs ONLY via manual workflow_dispatch. It never runs (and never publishes)
#   on push, pull_request or merge.
# - The `verify` job is the full release checklist: static checks, SDK tests,
#   build/sync verification, package validation, version validation and a pack
#   dry-run. It NEVER publishes and never uses any credential.
# - The `stage` job stages the current package version for owner approval: it
#   runs `npm stage publish` authenticated with npm Trusted Publishing (GitHub
#   Actions OIDC — `id-token: write`; this workflow contains NO npm token
#   reference of any kind; see packages/assistant-sdk/RELEASE.md §6.3/§6.4).
#   Staging does NOT publish: a staged version stays hidden until the owner
#   approves it on npmjs.com with 2FA, and staging a brand-new package may
#   first expose a public `0.0.0-stage` placeholder (the 0.1.0 first
#   publication completed this flow; its temporary bootstrap token was
#   created, used and revoked — recorded in RELEASE.md). The job requires
#   ALL of:
#     1. manual dispatch with action=stage and confirm_stage=stage
#     2. github.ref == refs/heads/main (never on untrusted branches)
#     3. the full `verify` job having succeeded first (needs: verify)
#     4. the protected `sdk-npm-publish` environment (owner-configured with
#        required reviewers — the existing environment; never recreated);
#        the Trusted Publisher connection must name this same environment
#     5. npm CLI >= 11.15.0 (staged-publishing requirement) — guarded below
#     6. the package validator immediately before staging
#   It sets no `SDK_RELEASE_ENABLED`, never runs a direct publish, and never
#   approves, rejects or promotes a stage — approval is the owner's decision
#   on npmjs.com with account 2FA (short-lived trust tokens cannot run
#   `npm stage approve`), never this workflow's. The owner registers the npm
#   Trusted Publisher connection manually after reviewing/merging the PR:
#   allowed actions must include `npm stage publish` (always allowed) and
#   `npm publish` for the publish job, and the connection's first successful
#   publish must land within 48 hours of creating it (RELEASE.md §6.3).
# - The `publish` job is STRUCTURE ONLY and stays disabled until a release is
#   explicitly approved. It requires ALL of:
#     1. manual dispatch with action=publish and confirm_publish=publish
#     2. the repository variable SDK_RELEASE_ENABLED == 'true' (not set)
#     3. the protected `sdk-npm-publish` environment (owner-configured with
#        required reviewers — verify the reviewer protection is actually
#        enforced before the first publish run)
#     4. npm Trusted Publishing (OIDC) configured for this package on npmjs.com:
#        GitHub Actions publisher → owner `sandro-defender`, repo
#        `you-ge-assistant`, workflow filename `sdk-release-prep.yml`,
#        environment `sdk-npm-publish`. No npm token secret is used on this
#        path — the runner mints a short-lived OIDC token (`id-token: write`)
#        that npm exchanges for a publish token.
#     5. the SDK_RELEASE_CONFIRM env that this publish job injects — the
#        package's prepublishOnly refuses an npm publish without it. This is
#        an accidental-publish guard only: it does NOT make direct publishing
#        impossible, and anyone holding npm publish rights can still publish
#        directly (see packages/assistant-sdk/RELEASE.md §5).
#   The 0.1.0 release PR satisfied the former package-level requirement
#   ("private": true removed per the runbook); gates 1-5 remain closed.
#   Provenance attestations are generated automatically by npm over OIDC
#   (--provenance is kept explicit). OIDC trusted publishing requires
#   npm CLI >= 11.5.1 and Node >= 22.14.0, so both jobs pin Node 24 and
#   guard the npm version. See packages/assistant-sdk/RELEASE.md §6.
#   Never commit tokens: this workflow references no npm token at all —
#   verify, stage and publish authenticate without any stored npm credential.
# - The `oidc-check` action is a NON-MUTATING Trusted Publishing verification
#   (RELEASE.md §6.6): inside the protected environment it exchanges this
#   workflow's GitHub OIDC id_token for a short-lived package-scoped npm
#   token using the documented npm Registry API operation
#   `POST /-/npm/v1/oidc/token/exchange/package/<name>` and prints only the
#   HTTP status and expiry. It runs no staging, no approval, no dist-tag
#   operation and no release publish command, stores nothing in GitHub
#   Secrets, and never claims more than Trusted Publisher authentication:
#   publishing permission is proven only by an actual registry-accepted
#   stage or publish run, never by this check.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'verify = full release checklist without publishing. stage = stage the package version for owner approval on npm (see workflow header). publish = reserved for explicitly approved releases (see workflow header). oidc-check = non-mutating Trusted Publishing (OIDC) token-exchange check — no publish, no stage, no approval, no dist-tag change (see workflow header and RELEASE.md §6.6).'
        type: choice
        options: [verify, stage, publish, oidc-check]
        default: verify
      confirm_publish:
        description: 'For action=publish only: type "publish" to confirm. Ignored for verify and stage.'
        required: false
        default: ''
      confirm_stage:
        description: 'For action=stage only: type "stage" to confirm. Ignored for verify and publish.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sdk-release-prep
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    # Runs for action=verify/stage/publish exactly as before. Skipped only for
    # action=oidc-check: the standalone non-mutating OIDC check does not need
    # the release checklist — and its "Version has not been published yet"
    # step (correctly) fails while 0.1.1 sits on the registry after the
    # 2026-11-07 release (see RELEASE.md §7); gating keeps the check's run
    # green-or-red for exactly what it measures.
    if: github.event.inputs.action != 'oidc-check'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json

      - name: Static checks, contracts and unit tests
        run: npm run check

      - name: Standalone SDK tests
        run: npm test
        working-directory: packages/assistant-sdk

      - name: Build verification (browser-bundle sync)
        run: node scripts/sync-sdk-browser.mjs --check

      - name: Package and version validation
        run: node packages/assistant-sdk/scripts/validate-package.mjs

      - name: Package contents dry-run
        run: npm pack --dry-run
        working-directory: packages/assistant-sdk

      - name: Version has not been published yet
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/assistant-sdk/package.json').version")"
          name="$(node -p "require('./packages/assistant-sdk/package.json').name")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${name}@${version} already exists on the registry. Bump the version before releasing."
            exit 1
          fi
          echo "OK: ${name}@${version} is not on the registry yet."

      - name: Consumer build verification (React example)
        run: npm ci && npm run typecheck && npm run build
        working-directory: example

  publish:
    name: Publish (disabled until explicitly approved)
    needs: verify
    # STRUCTURE ONLY — see the workflow header. This job does not run on push,
    # pull_request or merge (the workflow has no such triggers), and not until
    # every explicit-approval gate below is satisfied.
    if: >-
      github.event.inputs.action == 'publish' &&
      github.event.inputs.confirm_publish == 'publish' &&
      vars.SDK_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: sdk-npm-publish
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC) — required
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm CLI supports OIDC trusted publishing
        run: |
          set -euo pipefail
          npm -v | awk -F. '
            $1 < 11 || ($1 == 11 && ($2 < 5 || ($2 == 5 && $3 < 1))) {
              print "::error::npm >= 11.5.1 is required for npm Trusted Publishing (OIDC); found " $0
              exit 1
            }
            { print "npm " $0 " satisfies the npm Trusted Publishing requirement (>= 11.5.1)" }
          '

      - name: Final package validation
        run: node packages/assistant-sdk/scripts/validate-package.mjs

      - name: Publish to npm via OIDC trusted publishing (requires explicit release approval)
        run: npm publish --access public --provenance
        working-directory: packages/assistant-sdk
        env:
          # Explicit publish authorization: prepublishOnly refuses an npm
          # publish that lacks this variable. This is an accidental-publish
          # guard only (not a security boundary) — see RELEASE.md §5.
          # NOTE: deliberately no npm auth token is set here — npm
          # authenticates with the short-lived OIDC token minted by
          # `id-token: write` above (npm Trusted Publishing).
          SDK_RELEASE_CONFIRM: publish

  stage:
    name: Stage the package version for owner approval (never publishes)
    needs: verify
    # Staging job — see the workflow header. Runs only on an explicit manual
    # dispatch (action=stage + confirm_stage=stage) from main, after the full
    # verify job succeeded, inside the protected `sdk-npm-publish`
    # environment. Never runs on push, pull_request or merge — this workflow
    # has no such triggers, so the per-run OIDC credential is never available
    # to pull-request or untrusted-branch workflows.
    if: >-
      github.event.inputs.action == 'stage' &&
      github.event.inputs.confirm_stage == 'stage' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sdk-npm-publish
    permissions:
      contents: read           # checkout only
      id-token: write          # npm Trusted Publishing (OIDC) — required for `npm stage publish`
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm CLI supports staged publishing (npm >= 11.15.0)
        run: |
          set -euo pipefail
          npm -v | awk -F. '
            $1 < 11 || ($1 == 11 && $2 < 15) {
              print "::error::npm >= 11.15.0 is required for npm stage publish; found " $0
              exit 1
            }
            { print "npm " $0 " satisfies the staged-publishing requirement (>= 11.15.0)" }
          '

      - name: Final package validation
        run: node packages/assistant-sdk/scripts/validate-package.mjs

      - name: Stage the package version for owner approval (npm stage publish)
        id: stage
        working-directory: packages/assistant-sdk
        env:
          # Authentication: npm Trusted Publishing (OIDC) — no token is
          # supplied anywhere. The `id-token: write` permission above lets
          # the runner mint a short-lived OIDC ID token that npm exchanges
          # for a short-lived, workflow+environment-scoped credential (npm
          # detects the GitHub Actions OIDC environment automatically; this
          # job guards npm >= 11.15.0 for staging). The npm Trusted
          # Publisher connection must allow `npm stage publish` and name the
          # `sdk-npm-publish` environment — see RELEASE.md §6.3.
          # `npm stage publish` runs the publish lifecycle, so the package's
          # prepublishOnly guard requires its explicit authorization here too.
          # Accidental-publish guard only (see workflow header).
          SDK_RELEASE_CONFIRM: publish
        run: |
          set -euo pipefail
          out="$(npm stage publish --access public 2>&1)"
          printf '%s\n' "$out"
          stage_id="$(printf '%s\n' "$out" | sed -n 's/.*staged with id \([0-9A-Za-z-]*\).*/\1/p' | tail -n 1)"
          if [ -z "${stage_id}" ]; then
            echo "::warning::Stage ID not found in the npm output — find it on npmjs.com (Staged Packages tab)."
          fi
          echo "stage_id=${stage_id}" >> "$GITHUB_OUTPUT"

      - name: Owner review instructions (staged — NOT published)
        env:
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        run: |
          version="$(node -p "require('./packages/assistant-sdk/package.json').version")"
          {
            echo "## Staged: @youge/assistant-sdk@${version} — NOT published"
            echo ""
            echo "This run only **staged** the version. Nothing is public yet:"
            echo ""
            echo "- **${version} will not install until you approve it** — staging never publishes by itself."
            echo "- Brand-new package: a public **\`0.0.0-stage\` placeholder** may already appear on the package page; that is expected. The real ${version} and its contents stay hidden until approval."
            echo "- Stage ID: \`${STAGE_ID:-see the Staged Packages tab}\`"
            echo "- Authentication: npm Trusted Publishing (OIDC) — no npm token was used or stored."
            echo ""
            echo "### Owner: approve ${version} (this — and only this — publishes it)"
            echo ""
            echo "1. Sign in to npmjs.com with the publishing account (2FA required)."
            echo "2. Open the package page, **Staged Packages** tab, and review the staged ${version}."
            echo "3. Click **Approve** and complete the 2FA prompt; npm then publishes ${version}. (The CLI alternative is documented in RELEASE.md §6.4.)"
            echo "4. Confirm the Trusted Publisher connection (RELEASE.md §6.3): owner \`sandro-defender\`, repo \`you-ge-assistant\`, workflow \`sdk-release-prep.yml\`, environment \`sdk-npm-publish\`, allowed actions \`npm stage publish\` AND the publish command — first successful publish within 48 hours of creating the connection."
            echo ""
            echo "This workflow only stages: it never publishes and never approves or rejects a stage."
          } >> "$GITHUB_STEP_SUMMARY"

  oidc-check:
    name: Verify npm Trusted Publishing (OIDC) without any registry change
    # Non-mutating verification (RELEASE.md §6.6). Runs only on an explicit
    # manual dispatch (action=oidc-check) inside the protected
    # `sdk-npm-publish` environment so the OIDC subject matches the Trusted
    # Publisher's environment field. The job performs exactly two HTTP calls:
    # GET GitHub's id_token endpoint (id-token: write) and POST the documented
    # npm Registry API token-exchange operation. It never runs a staging,
    # approval, dist-tag or release publish command, never reads a secret,
    # and writes no credential to disk or to the log output.
    if: github.event.inputs.action == 'oidc-check'
    runs-on: ubuntu-latest
    environment: sdk-npm-publish
    permissions:
      contents: read           # checkout only
      id-token: write          # GitHub OIDC id_token for the documented npm exchange
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Deliberately NO registry-url: this job must hold no .npmrc
          # credential placeholder of any kind — the only credential it ever
          # handles is the in-memory OIDC exchange inside the check script.
          package-manager-cache: false

      - name: npm CLI supports Trusted Publishing (OIDC) (npm >= 11.5.1)
        run: |
          set -euo pipefail
          npm -v | awk -F. '
            $1 < 11 || ($1 == 11 && ($2 < 5 || ($2 == 5 && $3 < 1))) {
              print "::error::npm >= 11.5.1 is required for npm Trusted Publishing (OIDC); found " $0
              exit 1
            }
            { print "npm " $0 " satisfies the npm Trusted Publishing requirement (>= 11.5.1)" }
          '

      - name: Exchange the GitHub OIDC identity for this package (documented npm API, no registry mutation)
        run: node scripts/oidc-trust-check.mjs
