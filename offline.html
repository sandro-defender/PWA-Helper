<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline — staff.you.ge</title>
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main>
      <img class="icon" src="/icons/icon-192.png" alt="" />
      <span class="badge"><span class="dot" id="dot"></span><span id="statusText">You are offline</span></span>
      <h1 id="headline">No connection</h1>
      <p id="message">Check your internet connection and try again. Pages you visited recently may still be available.</p>
      <a class="button" href="/">Try again</a>
      <div class="hint" id="hint">Checking connection…</div>
    </main>

    <script src="/offline.js" defer></script>
  </body>
</html>
